name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        platform:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: i686-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: armv5te-unknown-linux-musleabi }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-2022,   target: x86_64-win7-windows-msvc, build-std: true }
          - { os: windows-2022,   target: i686-win7-windows-msvc,   build-std: true }
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check tag matches version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build
        if: ${{ !matrix.platform.build-std }}
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          target: ${{ matrix.platform.target }}
          args: "--release"
          use-rust-cache: false
          cache-cross-binary: false
      - name: Build (build-std)
        if: ${{ matrix.platform.build-std }}
        env: { RUSTFLAGS: -C target-feature=+crt-static }
        run: |
          rustup toolchain install nightly-2026-09-05 --component rust-src
          cargo +nightly-2026-09-05 build --release -Z build-std --target ${{ matrix.platform.target }}
      - name: Package
        uses: houseabsolute/actions-rust-release@9e126fd5fc18f4cecf358b3909f3991ad59663dc # v1.0.1
        with:
          executable-name: disksec
          target: ${{ matrix.platform.target }}
          changes-file: ""
          extra-files: |
            README.md
            LICENSE
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: houseabsolute/actions-rust-release/publish@9e126fd5fc18f4cecf358b3909f3991ad59663dc # v1.0.1
        with:
          executable-name: disksec
          changes-file: ""
